; Fit directional VSM demand into the inherited 512-page low/medium budget.
; Positive bias reduces detail/cost. Higher tiers and page allocations inherit
; Engine defaults; this does not change a player's chosen quality level.
[ShadowQuality@0]
r.Shadow.Virtual.ResolutionLodBiasDirectional=1.0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=1.0

[ShadowQuality@1]
r.Shadow.Virtual.ResolutionLodBiasDirectional=1.0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=1.0
